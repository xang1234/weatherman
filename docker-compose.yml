services:
  titiler:
    image: ghcr.io/developmentseed/titiler:0.18.5
    platform: linux/amd64
    volumes:
      - ./.data:/data:ro
    environment:
      TITILER_API_CORS_ORIGINS: "*"
      WEB_CONCURRENCY: "2"
      GDAL_CACHEMAX: "200"
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pipeline:
    build: .
    command: ["uv", "run", "python", "scripts/run_pipeline.py", "--data-dir", "/data", "--hours", "0,3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48", "--max-runs", "2"]
    volumes:
      - ./.data:/data

  pipeline-gefs:
    build: .
    command: ["uv", "run", "python", "scripts/run_pipeline.py", "--model", "gefs", "--data-dir", "/data", "--hours", "0,3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48", "--max-runs", "2"]
    volumes:
      - ./.data:/data

  # One-shot: fetch the basemap extract the backend serves at /basemap (#70).
  # About 190 MB the first time; does nothing once .data/basemap has it. Never
  # fails, so the backend (which waits for it) still starts when offline.
  basemap:
    build: .
    command:
      - sh
      - -c
      - uv run python scripts/fetch_basemap.py --out /data/basemap/basemap.pmtiles || echo "WARNING - basemap fetch failed; weather will show without coastlines"
    volumes:
      - ./.data:/data

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Published weather data is read-only so the backend can't corrupt runs.
      - ./.data:/data:ro
      # Runtime artifacts (event journal, SSE replay state) need write access.
      - ./.runtime:/runtime
    environment:
      WEATHERMAN_DATA_DIR: /data
      TITILER_COG_ROOT: /data
      TITILER_BASE_URL: http://titiler:80
      TITILER_PUBLIC_URL: ""
      AIS_DB_PATH: ${AIS_DB_PATH:-/data/ais.duckdb}
      AIS_BACKEND: ${AIS_BACKEND:-legacy_parquet}
      AIS_TENANT_ID: ${AIS_TENANT_ID:-default}
      WEATHERMAN_EVENT_JOURNAL_PATH: ${WEATHERMAN_EVENT_JOURNAL_PATH:-/runtime/events/sse-events.jsonl}
      NEPTUNE_STORE_ROOT: ${NEPTUNE_STORE_ROOT:-/data/neptune}
      NEPTUNE_SOURCES: ${NEPTUNE_SOURCES:-noaa}
      NEPTUNE_MERGE: ${NEPTUNE_MERGE:-best}
      NEPTUNE_BBOX: ${NEPTUNE_BBOX:-}
      NEPTUNE_MMSI: ${NEPTUNE_MMSI:-}
      NEPTUNE_RAW_POLICY: ${NEPTUNE_RAW_POLICY:-metadata}
      NEPTUNE_OVERWRITE: ${NEPTUNE_OVERWRITE:-false}
      NEPTUNE_API_KEYS_JSON: ${NEPTUNE_API_KEYS_JSON:-}
      NEPTUNE_LIVE_SOURCE: ${NEPTUNE_LIVE_SOURCE:-aisstream}
      NEPTUNE_LIVE_LANDING_DIR: ${NEPTUNE_LIVE_LANDING_DIR:-/data/neptune-live}
      NEPTUNE_LIVE_BBOX: ${NEPTUNE_LIVE_BBOX:-}
      NEPTUNE_LIVE_MMSI: ${NEPTUNE_LIVE_MMSI:-}
      NEPTUNE_LIVE_MAX_MESSAGES: ${NEPTUNE_LIVE_MAX_MESSAGES:-}
      NEPTUNE_LIVE_CLEANUP: ${NEPTUNE_LIVE_CLEANUP:-false}
      NEPTUNE_LIVE_FLUSH_INTERVAL: ${NEPTUNE_LIVE_FLUSH_INTERVAL:-60}
      NEPTUNE_LIVE_API_KEY: ${NEPTUNE_LIVE_API_KEY:-}
      # Live AIS ingest runs inside the backend (DuckDB can't share ais.duckdb
      # between a writing and a reading process). It writes AIS_DB_PATH and
      # the NEPTUNE_* directories, so with AIS_LIVE=true point them at
      # /runtime: /data is read-only. See docs/ais-neptune.md.
      AIS_LIVE: ${AIS_LIVE:-false}
      CORS_ORIGINS: "*"
    depends_on:
      titiler:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully
      pipeline-gefs:
        condition: service_completed_successfully
      # So the first page load finds the basemap rather than a 404.
      basemap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
